name: Build and Release Devote

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            script: release:mac
          - os: windows-latest
            script: release:win

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: x64

      - name: Install dependencies
        run: npm install

      - name: Build and Release Devote
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web assets and sync Capacitor
        run: npm run cap:build

      - name: Extract version info from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building versionName=$VERSION versionCode=$VERSION_CODE"

      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionName=${{ steps.version.outputs.version_name }} -PversionCode=${{ steps.version.outputs.version_code }}
        working-directory: android

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk Devote-${{ steps.version.outputs.version_name }}-android.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Devote-${{ steps.version.outputs.version_name }}-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
